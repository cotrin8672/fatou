name: Verify Fatou editor fixes on Windows
on:
  push:
    branches: [verify/editor-fixes-windows]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fatou-editor-fixes-verification
  cancel-in-progress: true
jobs:
  windows-x64:
    if: github.repository == 'cotrin8672/fatou' && github.ref == 'refs/heads/verify/editor-fixes-windows'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build Fatou and run Rust and native Windows SMB tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.100.0 --profile minimal
          rustup target add --toolchain 1.100.0 x86_64-pc-windows-msvc
          cargo +1.100.0 test --locked --workspace
          cargo +1.100.0 build --locked --release --target x86_64-pc-windows-msvc -p fatou --bin fatou
          ./scripts/windows-network-smoke.ps1 -Fatou 'target/x86_64-pc-windows-msvc/release/fatou.exe'
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: '1.13.4'
          arch: x64
      - name: Test actual Dagger and FFTW packages and apply the returned edits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:JULIA_PKG_PRECOMPILE_AUTO = '0'
          $env:JULIA_DEPOT_PATH = Join-Path $env:RUNNER_TEMP 'editor-workflow-depot'
          $env:JULIA_BINDIR = & julia --startup-file=no -e 'print(Sys.BINDIR)'
          $fixture = Join-Path $env:RUNNER_TEMP 'editor-workflow-project'
          $member = Join-Path $fixture 'member'
          New-Item -ItemType Directory -Path $member -Force | Out-Null
          Copy-Item -LiteralPath ./scripts/fixtures/editor-workflow/Project.toml -Destination $member
          Copy-Item -LiteralPath ./scripts/fixtures/editor-workflow/Manifest.toml -Destination $fixture
          Set-Content -LiteralPath (Join-Path $fixture 'Project.toml') -Value "[workspace]`nprojects = [`"member`"]"
          julia --startup-file=no "--project=$member" -e 'using Pkg; Pkg.instantiate()'
          node ./scripts/editor-workflow-smoke.mjs 'target/x86_64-pc-windows-msvc/release/fatou.exe' $member
          julia --startup-file=no ./examples/compiler-inlay/test_bridge.jl
      - name: Package exactly the tested executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path dist,dist/examples/compiler-inlay,artifact | Out-Null
          foreach ($file in @('README.md', 'bridge.jl', 'demo.jl', 'fixture.jl', 'nvim.lua', 'watch-demo.jl', 'watch-function.jl')) {
            Copy-Item -LiteralPath "examples/compiler-inlay/$file" -Destination dist/examples/compiler-inlay
          }
          Copy-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/fatou.exe',LICENSE,README.md -Destination dist
          if ((& ./dist/fatou.exe --version) -ne 'fatou 0.27.4') { throw 'Unexpected version' }
          Compress-Archive -Path dist/* -DestinationPath artifact/fatou-windows-x64.zip
          (Get-FileHash artifact/fatou-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content artifact/sha256.txt
          $env:GITHUB_SHA | Set-Content artifact/commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fatou-editor-fixes-windows-x64
          path: artifact/*
          if-no-files-found: error
